[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unifai-guard"
version = "0.1.0"
description = "A governance layer for agents that call tools they discovered. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["agents", "tool-calling", "prompt-injection", "defi", "unifai", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["unifai_guard*"]

[tool.setuptools.package-data]
unifai_guard = ["py.typed"]
